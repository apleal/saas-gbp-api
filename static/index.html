<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaaS GBP</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <main class="mx-auto max-w-5xl p-6">
    <header class="mb-8 flex items-center justify-between">
      <div>
        <p class="text-sm font-semibold uppercase tracking-widest text-sky-400">SaaS GBP</p>
        <h1 class="text-3xl font-bold">Tus fichas de negocio</h1>
      </div>
      <button id="logout" class="hidden rounded-lg border border-slate-700 px-4 py-2">Salir</button>
    </header>

    <section id="auth" class="mx-auto max-w-md rounded-2xl bg-slate-900 p-6 shadow-xl">
      <h2 id="auth-title" class="mb-5 text-xl font-semibold">Iniciar sesión</h2>
      <form id="auth-form" class="space-y-4">
        <input id="email" type="email" required placeholder="Email"
               class="w-full rounded-lg border border-slate-700 bg-slate-800 px-4 py-3">
        <input id="password" type="password" required minlength="8" placeholder="Contraseña"
               class="w-full rounded-lg border border-slate-700 bg-slate-800 px-4 py-3">
        <button class="w-full rounded-lg bg-sky-500 px-4 py-3 font-semibold text-slate-950">Continuar</button>
      </form>
      <button id="toggle-auth" class="mt-4 text-sm text-sky-400">Crear una cuenta</button>
    </section>

    <section id="dashboard" class="hidden grid gap-6 lg:grid-cols-[360px_1fr]">
      <div class="h-fit space-y-4 rounded-2xl bg-slate-900 p-5">
        <div>
          <h2 class="text-xl font-semibold">Importar negocios</h2>
          <p class="mt-1 text-sm text-slate-400">Conecta la cuenta que administra tus perfiles de Google.</p>
        </div>
        <button id="google-connect" class="w-full rounded-lg bg-white px-4 py-3 font-semibold text-slate-950">
          Añadir cuenta de Google
        </button>
        <div id="google-accounts" class="space-y-2"></div>
        <form id="import-form" class="hidden space-y-3">
          <div id="google-locations" class="max-h-72 space-y-2 overflow-y-auto"></div>
          <input name="gemini_api_key" required type="password" placeholder="Gemini API key" class="field">
          <textarea name="prompt_custom" placeholder="Prompt personalizado (opcional)" class="field"></textarea>
          <button class="w-full rounded-lg bg-sky-500 px-4 py-3 font-semibold text-slate-950">
            Importar seleccionadas
          </button>
        </form>
        <p class="text-xs text-slate-400">Puedes importar un máximo de 5 ubicaciones.</p>
      </div>
      <div>
        <p id="message" class="mb-4 hidden rounded-lg p-3"></p>
        <div id="fichas" class="grid gap-4 sm:grid-cols-2"></div>
      </div>
    </section>
  </main>

  <style type="text/tailwindcss">
    .field { @apply w-full rounded-lg border border-slate-700 bg-slate-800 px-4 py-3 outline-none focus:border-sky-500; }
  </style>
  <script>
    const state = { register: false, token: localStorage.getItem("access_token"), connectionId: null };
    const auth = document.querySelector("#auth");
    const dashboard = document.querySelector("#dashboard");
    const message = document.querySelector("#message");

    function showMessage(text, error = false) {
      message.textContent = text;
      message.className = `mb-4 rounded-lg p-3 ${error ? "bg-red-950 text-red-300" : "bg-emerald-950 text-emerald-300"}`;
    }

    async function api(path, options = {}) {
      const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
      if (state.token) headers.Authorization = `Bearer ${state.token}`;
      const response = await fetch(path, { ...options, headers });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        const detail = Array.isArray(data.detail)
          ? data.detail.map(item => item.msg || JSON.stringify(item)).join("; ")
          : data.detail;
        const error = new Error(detail || `Error ${response.status}: ${response.statusText}`);
        error.status = response.status;
        throw error;
      }
      return data;
    }

    async function loadFichas() {
      try {
        const fichas = await api("/api/v1/fichas");
        document.querySelector("#fichas").innerHTML = fichas.length
          ? fichas.map(f => `<article class="rounded-2xl bg-slate-900 p-5">
              <h3 class="font-semibold">${escapeHtml(f.nombre_negocio)}</h3>
              <p class="text-sm text-slate-400">${escapeHtml(f.categoria)} · ${escapeHtml(f.ciudad)}</p>
              ${f.direccion ? `<p class="mt-2 text-xs text-slate-500">${escapeHtml(f.direccion)}</p>` : ""}
              <p class="mt-3 text-xs text-slate-500">Google: ${f.google_conectada ? "conectado" : "pendiente"} · Gemini: ${f.tiene_gemini_api_key ? "configurado" : "pendiente"}</p>
              <button data-delete-ficha="${f.id}" class="mt-4 text-sm text-red-400">Borrar ficha</button>
            </article>`).join("")
          : '<p class="text-slate-400">Todavía no tienes fichas.</p>';
      } catch (error) {
        if (error.status === 401) logout();
        else showMessage(error.message, true);
      }
    }

    function escapeHtml(value) {
      const node = document.createElement("div");
      node.textContent = value;
      return node.innerHTML;
    }

    function render() {
      auth.classList.toggle("hidden", Boolean(state.token));
      dashboard.classList.toggle("hidden", !state.token);
      document.querySelector("#logout").classList.toggle("hidden", !state.token);
      if (state.token) {
        loadFichas();
        loadGoogleStatus();
      }
    }

    function logout() {
      state.token = null;
      localStorage.removeItem("access_token");
      render();
    }

    document.querySelector("#toggle-auth").addEventListener("click", () => {
      state.register = !state.register;
      document.querySelector("#auth-title").textContent = state.register ? "Crear cuenta" : "Iniciar sesión";
      document.querySelector("#toggle-auth").textContent = state.register ? "Ya tengo una cuenta" : "Crear una cuenta";
    });

    document.querySelector("#auth-form").addEventListener("submit", async event => {
      event.preventDefault();
      try {
        const data = await api(`/api/v1/auth/${state.register ? "register" : "login"}`, {
          method: "POST",
          body: JSON.stringify({
            email: document.querySelector("#email").value,
            password: document.querySelector("#password").value
          })
        });
        state.token = data.access_token;
        localStorage.setItem("access_token", data.access_token);
        render();
      } catch (error) {
        alert(error.message);
      }
    });

    async function loadGoogleStatus() {
      try {
        const status = await api("/api/v1/google/status");
        if (!state.connectionId && status.accounts.length) state.connectionId = status.accounts[0].id;
        document.querySelector("#google-accounts").innerHTML = status.accounts.map(account => `
          <div class="flex items-center gap-2 rounded-lg border border-slate-700 p-2">
            <button data-account="${account.id}" class="min-w-0 flex-1 truncate text-left text-sm ${state.connectionId === account.id ? "text-sky-400" : ""}">
              ${escapeHtml(account.email)}
            </button>
            <button data-delete-account="${account.id}" class="px-2 text-red-400" title="Desconectar">×</button>
          </div>`).join("");
        if (status.accounts.some(account => account.id === state.connectionId)) {
          await loadGoogleLocations();
        } else {
          state.connectionId = null;
          document.querySelector("#import-form").classList.add("hidden");
        }
      } catch (error) {
        showMessage(error.message, true);
      }
    }

    async function loadGoogleLocations() {
      if (!state.connectionId) return;
      try {
        const locations = await api(`/api/v1/google/locations?connection_id=${state.connectionId}`);
        const container = document.querySelector("#google-locations");
        container.innerHTML = locations.length
          ? locations.map((location, index) => `<label class="flex cursor-pointer gap-3 rounded-lg border border-slate-700 p-3">
              <input type="checkbox" name="location" value="${index}" class="mt-1">
              <span>
                <strong class="block">${escapeHtml(location.title)}</strong>
                <small class="text-slate-400">${escapeHtml(location.address || location.category || "")}</small>
              </span>
            </label>`).join("")
          : '<p class="text-sm text-slate-400">Google no devolvió ubicaciones administrables.</p>';
        container.dataset.locations = JSON.stringify(locations);
        document.querySelector("#import-form").classList.remove("hidden");
      } catch (error) {
        showMessage(error.message, true);
      }
    }

    document.querySelector("#google-connect").addEventListener("click", async () => {
      try {
        const data = await api("/api/v1/google/connect");
        window.location.href = data.authorization_url;
      } catch (error) {
        showMessage(error.message, true);
      }
    });

    document.querySelector("#import-form").addEventListener("submit", async event => {
      event.preventDefault();
      const form = new FormData(event.currentTarget);
      const allLocations = JSON.parse(document.querySelector("#google-locations").dataset.locations || "[]");
      const selected = form.getAll("location").map(index => allLocations[Number(index)]);
      if (!selected.length) return showMessage("Selecciona al menos una ubicación", true);
      try {
        await api("/api/v1/google/import", {
          method: "POST",
          body: JSON.stringify({
            connection_id: state.connectionId,
            locations: selected,
            gemini_api_key: form.get("gemini_api_key"),
            prompt_custom: form.get("prompt_custom") || null
          })
        });
        showMessage("Negocios y reseñas importados correctamente");
        await loadFichas();
      } catch (error) {
        showMessage(error.message, true);
      }
    });

    document.querySelector("#logout").addEventListener("click", logout);
    document.querySelector("#google-accounts").addEventListener("click", async event => {
      const accountButton = event.target.closest("[data-account]");
      if (accountButton) {
        state.connectionId = Number(accountButton.dataset.account);
        await loadGoogleStatus();
      }
      const deleteButton = event.target.closest("[data-delete-account]");
      if (deleteButton && confirm("¿Desconectar esta cuenta? Las fichas se conservarán.")) {
        try {
          await api(`/api/v1/google/connections/${deleteButton.dataset.deleteAccount}`, { method: "DELETE" });
          if (state.connectionId === Number(deleteButton.dataset.deleteAccount)) state.connectionId = null;
          showMessage("Cuenta de Google desconectada");
          await loadGoogleStatus();
        } catch (error) {
          showMessage(error.message, true);
        }
      }
    });
    document.querySelector("#fichas").addEventListener("click", async event => {
      const button = event.target.closest("[data-delete-ficha]");
      if (!button || !confirm("¿Borrar esta ficha y todos sus datos asociados?")) return;
      try {
        await api(`/api/v1/fichas/${button.dataset.deleteFicha}`, { method: "DELETE" });
        showMessage("Ficha borrada");
        await loadFichas();
      } catch (error) {
        showMessage(error.message, true);
      }
    });
    const googleParams = new URLSearchParams(location.search);
    const googleResult = googleParams.get("google");
    if (googleResult) {
      setTimeout(() => showMessage(
        googleResult === "connected"
          ? "Cuenta de Google conectada correctamente"
          : `No se pudo conectar Google: ${googleParams.get("reason") || "error desconocido"}`,
        googleResult !== "connected"
      ));
      history.replaceState({}, "", "/");
    }
    render();
  </script>
</body>
</html>
